en:
  site_settings:
    btcpay_enabled: "Enable BTCPay Server subscription integration"
    btcpay_server_url: "BTCPay Server URL"
    btcpay_api_key: "BTCPay Greenfield API key"
    btcpay_store_id: "BTCPay Store ID"
    btcpay_offering_id: "BTCPay Offering ID (holds the subscription plans)"
    btcpay_webhook_secret: "BTCPay webhook HMAC secret"
    btcpay_donations_enabled: "Accept one-off donations through a BTCPay POS app"
    btcpay_pos_app_id: "BTCPay Point of Sale app id (for donations)"
    btcpay_donation_currency: "Donation currency"
    btcpay_donation_min: "Minimum donation"
    btcpay_donation_points: "Gamification points per unit donated (0 = off)"
    btcpay_anonymous_checkout: "Allow logged-out visitors to buy (they are invited by email once paid)"
    btcpay_send_email: "Send the buyer's email to BTCPay (skips the email prompt at checkout)"
    btcpay_default_group: "Default group for plans with no group of their own"
    btcpay_button_label: "Payment button text (blank = translated default)"
    btcpay_tickets_title: "Heading on /tickets (blank = translated default)"
    btcpay_tickets_intro: "Intro on /tickets (blank = translated default)"
    btcpay_billing_title: "Heading on the profile billing tab (blank = translated default)"
    btcpay_billing_intro: "Intro on the billing tab (blank = translated default)"
    btcpay_nav_label: "Navigation link text (blank = translated default)"
    btcpay_reconcile_interval_hours: "Reconciliation job interval (hours)"
    btcpay_redirect_after_checkout: "Redirect path after BTCPay checkout"

  system_messages:
    btcpay_admin_notification:
      title: "BTCPay Alert: %{subject}"
      subject_template: "BTCPay Alert: %{subject}"
      text_body_template: |
        %{body}

        ---
        This is an automated message from the BTCPay Subscriptions plugin.

  discourse_btcpay:
    alerts:
      invite_failed:
        subject: "BTCPay: could not invite a buyer"
        body: |
          Someone paid for a subscription with the email %{email}, but the
          invite could not be sent: %{error}

          They have no access yet. Invite them by hand, or ask them to sign up
          with that address — their subscription attaches automatically.
      hmac_failures:
        subject: "BTCPay: webhook signature failing"
        body: |
          %{count} consecutive HMAC failures were detected.

          Check that the webhook secret matches between BTCPay and the
          `btcpay_webhook_secret` site setting. Until it does, no payment can
          grant access.
      plan_unmapped:
        subject: "BTCPay: plan has no group"
        body: |
          A payment settled for plan '%{plan_id}' (user %{username}) but the
          plan grants no Discourse group.

          Assign one on Admin → Plugins → BTCPay, set `discourse_group` in the
          plan's BTCPay metadata, or set a default group.
      group_missing:
        subject: "BTCPay: group does not exist"
        body: |
          Tried to add '%{username}' to the group '%{group}', which does not
          exist. Create it, then use the Sync button to grant access.
      dispute:
        subject: "BTCPay: invoice disputed"
        body: |
          Invoice %{invoice_id} was invalidated or refunded for '%{username}'.

          %{detail}
        retained: "Group access was kept, pending your review."
        no_record: "No local subscription record exists for this user — nothing was granted."
      overpaid:
        subject: "BTCPay: invoice overpaid"
        body: |
          Invoice %{invoice_id} received more than the amount due. BTCPay can
          refund the difference from the invoice page.
      needs_upgrade:
        subject: "BTCPay: subscriber needs a different plan"
        body: |
          BTCPay reports that '%{username}' needs to upgrade their plan. Group
          access was left untouched.
      paid_late:
        subject: "BTCPay: invoice paid late"
        body: |
          Invoice %{invoice_id} for '%{username}' was paid after it expired, so
          BTCPay granted nothing and the money is unclaimed.

          Mark the invoice settled in BTCPay to honour it, or refund it.
      underpaid:
        subject: "BTCPay: invoice underpaid"
        body: |
          Invoice %{invoice_id} for '%{username}' expired after receiving only
          %{received}. No access was granted.

          Refund it or top it up from BTCPay.
        partial: "a partial payment"
      refunded:
        subject: "BTCPay: refund created"
        body: |
          A refund was created for invoice %{invoice_id} ('%{username}', pull
          payment %{pull_payment_id}).

          Group access was left untouched — remove it by hand if the refund is
          final.
    errors:
      not_enabled: "BTCPay integration is not enabled."
      missing_config: "BTCPay Server is not fully configured."
      plan_not_found: "The requested plan was not found."
      downgrade_unsupported: "Changing to a cheaper plan is not supported yet."
      donation_too_small: "The smallest donation is %{minimum} %{currency}."
      badge_not_found: "That badge does not exist or is disabled."
      rate_limited: "Too many checkout attempts. Please wait a moment and try again."
      checkout_failed: "Failed to create BTCPay checkout. Please try again."
      webhook_invalid_signature: "Invalid webhook signature."
      webhook_duplicate: "Invoice already processed."
      user_not_found: "Could not find Discourse user for this subscription."
      group_not_found: "Target group does not exist."
