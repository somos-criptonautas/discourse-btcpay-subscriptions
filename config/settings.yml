btcpay:
  btcpay_enabled:
    default: false
    client: true
  btcpay_server_url:
    default: ""
    description: "BTCPay Server URL (e.g. https://btcpay.yourdomain.com)"
  btcpay_api_key:
    default: ""
    secret: true
    description: "Greenfield API key with invoice + subscription permissions"
  btcpay_store_id:
    default: ""
    description: "BTCPay Store ID"
  btcpay_offering_id:
    default: ""
    description: "BTCPay Offering ID that holds your subscription plans"
  btcpay_webhook_secret:
    default: ""
    secret: true
    description: "Webhook secret for HMAC signature validation"
  btcpay_donations_enabled:
    default: false
    client: true
    description: "Accept one-off donations through a BTCPay Point of Sale app."
  btcpay_pos_app_id:
    default: ""
    description: "BTCPay Point of Sale app id, from its URL /apps/<id>/pos. Required for donations."
  btcpay_donation_currency:
    default: "USD"
    description: "Currency donation amounts are entered in."
  btcpay_donation_min:
    default: 1
    min: 1
    description: "Smallest donation accepted, in the donation currency."
  btcpay_donation_points:
    default: 0
    min: 0
    description: "Gamification points per unit donated (needs discourse-gamification). 0 disables."
  btcpay_anonymous_checkout:
    default: false
    client: true
    description: "Let logged-out visitors buy. They enter their email at BTCPay and are invited to the forum when the payment settles."
  btcpay_send_email:
    default: true
    description: "Send the buyer's Discourse email to BTCPay so they are not asked for one at checkout. Off means BTCPay prompts for an address."
  btcpay_default_group:
    default: ""
    description: "Group granted by any plan with no group of its own. Per-plan groups are set on the BTCPay admin page."
  # Text overrides: blank means "use the translation for the viewer's locale".
  btcpay_button_label:
    default: ""
    client: true
    description: "Payment button text. Blank uses the translated default."
  btcpay_tickets_title:
    default: ""
    client: true
    description: "Heading on the /tickets page. Blank uses the translated default."
  btcpay_tickets_intro:
    default: ""
    client: true
    description: "Intro paragraph on /tickets. Blank uses the translated default."
  btcpay_billing_title:
    default: ""
    client: true
    description: "Heading on the /billing page. Blank uses the translated default."
  btcpay_billing_intro:
    default: ""
    client: true
    description: "Intro paragraph on /billing. Blank uses the translated default."
  btcpay_nav_label:
    default: ""
    client: true
    description: "Sidebar and profile link text. Blank uses the translated default."
  btcpay_reconcile_interval_hours:
    default: 4
    min: 1
    max: 168
    description: "How often the reconciliation job runs (in hours)"
  btcpay_redirect_after_checkout:
    default: "/billing"
    client: true
    description: "Discourse path to redirect to after BTCPay checkout"
